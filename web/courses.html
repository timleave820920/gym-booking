<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>综合训练馆 · 课程管理</title>
<style>
:root {
  --bg: #F9F4DF; --card: #FFFFFF; --dark: #1A1A23; --lime: #B9FF66;
  --purple: #5B57EB; --gray: #8A8A8A; --line: #E8E2CC; --red: #E5484D;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--dark); min-height: 100vh; }
header { display: flex; align-items: center; justify-content: space-between; padding: 14px 28px; background: var(--dark); color: #fff; }
.brand { font-size: 17px; font-weight: 700; letter-spacing: 1px; }
.tabs { display: flex; gap: 8px; }
.tab { border: none; background: rgba(255,255,255,0.12); color: #ddd; padding: 8px 22px; border-radius: 20px; font-size: 14px; cursor: pointer; }
.tab.active { background: var(--lime); color: var(--dark); font-weight: 700; }
.panel { display: flex; gap: 24px; padding: 24px 28px; max-width: 1200px; margin: 0 auto; }
.panel.hidden { display: none; }
h2 { font-size: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
h3 { font-size: 14px; margin-bottom: 12px; }
.block { background: var(--card); border-radius: 14px; padding: 18px; margin-bottom: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.05); }
.course-list { width: 260px; flex-shrink: 0; }
.editor { flex: 1; min-width: 0; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field.wide { grid-column: 1 / -1; }
label { font-size: 12px; color: #6B6B76; }
input[type=text], input[type=number], select, textarea {
  border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: 14px; background: #fff; width: 100%; outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--purple); }
textarea { resize: vertical; min-height: 72px; }
.member-hint { font-size: 12px; color: var(--purple); }
.cover-area { display: flex; gap: 14px; align-items: flex-start; }
.gallery { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.gal-item { width: 96px; border-radius: 10px; border: 2px solid var(--dark); overflow: hidden; background: #fff; position: relative; }
.gal-item img { width: 100%; height: 72px; object-fit: cover; display: block; }
.gal-empty { height: 96px; display: flex; align-items: center; justify-content: center; background: #F0EDDF; }
.gal-ph { font-size: 30px; font-weight: 700; color: #B9BFAD; }
.gal-foot { display: flex; gap: 6px; align-items: center; padding: 4px 6px; font-size: 11px; color: var(--gray); }
.gal-foot span { flex: 1; }
.gal-x { color: #E5484D; cursor: pointer; font-weight: 700; }
.gal-mv { color: var(--purple); cursor: pointer; }
.cover-preview { width: 120px; height: 120px; border-radius: 12px; border: 2px solid var(--dark); object-fit: cover; background: #F0EDDF; display: none; }
.cover-controls { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.upload-btn { display: inline-block; padding: 8px 16px; border-radius: 18px; background: var(--dark); color: var(--lime); font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; }
.spec-hint { font-size: 12px; color: var(--gray); line-height: 1.6; }
.ops { display: flex; gap: 12px; align-items: center; }
.btn { border: none; padding: 10px 24px; border-radius: 22px; font-size: 14px; font-weight: 700; cursor: pointer; }
.btn-save { background: var(--dark); color: var(--lime); }
.btn-del { background: #FCEBEB; color: var(--red); }
.btn-new { background: var(--lime); color: var(--dark); }
.btn-add { background: var(--purple); color: #fff; }
.btn-publish { background: var(--dark); color: var(--lime); }
.msg { font-size: 13px; color: #3D9970; margin-left: 10px; }
.msg.err { color: var(--red); }
.list-item { background: #fff; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; border: 2px solid transparent; }
.list-item.active { border-color: var(--purple); }
.list-item .li-name { font-size: 14px; font-weight: 700; }
.list-item .li-meta { font-size: 12px; color: var(--gray); margin-top: 2px; }
.badge { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 8px; margin-left: 6px; }
.badge-pub { background: #E5FFC9; color: #3D9970; }
.badge-draft { background: #F0EDDF; color: var(--gray); }
.sch-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.sch-bar select { width: 280px; }
.sch-bar span { font-size: 13px; color: var(--gray); }
.rules-row { display: grid; grid-template-columns: 90px 1fr 1fr 1fr 1fr 90px 30px; gap: 8px; margin-bottom: 8px; }
.rules-row select { padding: 7px 6px; font-size: 13px; }
.row-del { border: none; background: none; color: var(--red); font-size: 18px; cursor: pointer; }
.publish-bar { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.publish-bar .field { flex: 1; min-width: 160px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { color: var(--gray); font-weight: 500; background: #FAF7EC; }
td .cap-input { width: 64px; padding: 4px 6px; font-size: 12px; }
.cap-save { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
.st-pub { color: #3D9970; } .st-ongoing { color: var(--red); } .st-end { color: var(--gray); } .st-cancel { color: var(--gray); }
.op-cancel { border: 1px solid #F7C1C1; color: var(--red); background: #FCEBEB; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
.op-cancel[disabled] { opacity: 0.4; cursor: not-allowed; }
.empty-tip { text-align: center; color: var(--gray); padding: 30px 0; font-size: 13px; }
/* 邀请看板 */
.board-cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
.bc { background: var(--dark); border-radius: 12px; padding: 14px 16px; }
.bc-v { font-size: 22px; font-weight: 700; color: var(--lime); }
.bc-l { font-size: 12px; color: #bbb; margin-top: 4px; }
.trend { display: flex; align-items: flex-end; gap: 8px; height: 130px; padding-top: 6px; overflow-x: auto; }
.tr-col { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 26px; }
.tr-bar { width: 14px; background: var(--purple); border-radius: 4px 4px 0 0; }
.tr-day { font-size: 10px; color: var(--gray); }
.tr-num { font-size: 10px; color: var(--gray); }
.member-line { font-size: 12px; color: var(--purple); margin-top: 6px; }
</style>
</head>
<body>
<header>
  <div class="brand">综合训练馆 · 课程管理</div>
  <nav class="tabs">
    <button class="tab active" id="tab-set" onclick="switchTab('set')">课程设定</button>
    <button class="tab" id="tab-sch" onclick="switchTab('sch')">排表管理</button>
    <button class="tab" id="tab-board" onclick="switchTab('board')">邀请看板</button>
  </nav>
</header>

<!-- ============ 课程设定 ============ -->
<section class="panel" id="panel-set">
  <aside class="course-list">
    <h2>课程列表 <button class="btn btn-new" onclick="newCourse()">+ 新增</button></h2>
    <div id="courseList"></div>
  </aside>

  <main class="editor">
    <div class="block">
      <h3>基本信息</h3>
      <div class="grid">
        <div class="field wide"><label>课程名称 *</label><input type="text" id="f-name" placeholder="如：Hyrox冲冲冲"></div>
        <div class="field"><label>分类</label><select id="f-category"></select></div>
        <div class="field"><label>难度（1-5）</label><select id="f-level"></select></div>
        <div class="field"><label>时长（分钟）</label><select id="f-duration"></select></div>
        <div class="field"><label>价格（元）</label><select id="f-price"></select><div class="member-line" id="memberHint"></div></div>
        <div class="field"><label>状态</label><select id="f-status"></select></div>
      </div>
    </div>

    <div class="block">
      <h3>图片与描述</h3>
      <div class="field wide">
        <label>封面图（详情页顶部大图 · 建议 1:1 方图 ≥750×750px · 单张 ≤512KB · JPG/PNG/WebP）</label>
        <div class="cover-area">
          <img class="cover-preview" id="coverImg" alt="封面预览">
          <div class="cover-controls">
            <span class="upload-btn" onclick="document.getElementById('fileInput').click()">⬆ 上传本地图片</span>
            <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="uploadImage(this)">
            <select id="f-cover" onchange="previewCover()"></select>
          </div>
        </div>
      </div>
      <div class="field wide" style="margin-top:12px"><label>课程描述（显示在课程条第二行 + 详情页介绍区）</label><textarea id="f-description" placeholder="如：高强度进阶，挑战极限"></textarea></div>
      <div class="field wide" style="margin-top:12px"><label>卖点标签（逗号分隔，显示在详情页副标题）</label><input type="text" id="f-tags" placeholder="如：高效燃脂, 新手友好, 器械混合"></div>
    </div>

    <div class="block">
      <h3>课程详情页配置</h3>
      <div class="field wide">
        <label>顶部轮播图（最多 5 张 · 服务器端存储不入包 · 单张 ≤512KB · 未配置位置显示数字占位）</label>
        <div class="gallery" id="galleryBox"></div>
        <span class="upload-btn" onclick="document.getElementById('galleryInput').click()">⬆ 上传轮播图</span>
        <input type="file" id="galleryInput" accept="image/*" style="display:none" onchange="uploadGallery(this)">
      </div>
      <div class="field wide" style="margin-top:12px"><label>简要标题（课程名下方副标题）</label><input type="text" id="f-summary" placeholder="如：Hyrox 精英训练 · 燃脂进阶"></div>
      <div class="grid">
        <div class="field wide"><label>地址（详情页地点展示 + 导航）</label><input type="text" id="f-address" placeholder="成都市成华区好事健身馆"></div>
        <div class="field"><label>纬度 lat</label><input type="text" id="f-lat" placeholder="30.6636"></div>
        <div class="field"><label>经度 lng</label><input type="text" id="f-lng" placeholder="104.1049"></div>
        <div class="field wide"><label>教练介绍（详情页教练说明 · 保存到该课程教练）</label><textarea id="f-coachbio" placeholder="如：Hyrox个人精英运动员，40+引体达人，二娃妈妈，素人零基础"></textarea></div>
      </div>
    </div>

    <div class="ops">
      <button class="btn btn-save" onclick="saveCourse()">保存课程</button>
      <button class="btn btn-del" onclick="deleteCourse()">删除课程</button>
      <span class="msg" id="saveMsg"></span>
    </div>
  </main>
</section>

<!-- ============ 排表管理 ============ -->
<section class="panel hidden" id="panel-sch">
  <main style="flex:1; min-width:0">
    <div class="sch-bar">
      <select id="s-course" onchange="loadSchedule()"></select>
      <span>选择课程后配置排课规则 / 发布 / 管理场次</span>
    </div>

    <div class="block">
      <h3>每周排课规则（发布时按此批量生成场次）</h3>
      <div id="rulesBox"></div>
      <div style="display:flex; gap:10px; align-items:center; margin-top:10px">
        <button class="btn btn-add" onclick="addRule()">+ 添加一条规则</button>
        <button class="btn btn-save" onclick="saveRules()">保存规则</button>
        <span class="msg" id="rulesMsg"></span>
      </div>
    </div>

    <div class="block">
      <h3>发布场次（按上面规则生成，已存在自动跳过）</h3>
      <div class="publish-bar">
        <div class="field"><label>起始日期</label><select id="f-date-from"></select></div>
        <div class="field"><label>结束日期</label><select id="f-date-to"></select></div>
        <button class="btn btn-publish" onclick="publishCourse()">发布课程</button>
        <span class="msg" id="pubMsg"></span>
      </div>
    </div>

    <div class="block">
      <h3>场次列表 <span id="sessionCount" style="font-size:12px;color:var(--gray);font-weight:400"></span></h3>
      <table>
        <thead><tr><th>日期</th><th>时间</th><th>课程</th><th>教练</th><th>场地</th><th>已约/容量</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="sessionBody"></tbody>
      </table>
      <div class="empty-tip" id="sessionEmpty">选择日期范围后加载场次</div>
    </div>
  </main>
</section>

<!-- ============ 邀请看板 ============ -->
<section class="panel hidden" id="panel-board">
  <main style="flex:1; min-width:0">
    <!-- 总览指标 -->
    <div class="board-cards">
      <div class="bc"><div class="bc-v" id="bd-total">-</div><div class="bc-l">总邀请</div></div>
      <div class="bc"><div class="bc-v" id="bd-ordered">-</div><div class="bc-l">已首订</div></div>
      <div class="bc"><div class="bc-v" id="bd-rate">-</div><div class="bc-l">转化率</div></div>
      <div class="bc"><div class="bc-v" id="bd-inviters">-</div><div class="bc-l">参与邀请人</div></div>
      <div class="bc"><div class="bc-v" id="bd-reward">-</div><div class="bc-l">已发放奖励</div></div>
    </div>

    <div style="display:flex; gap:16px; align-items:flex-start;">
      <div class="block" style="flex:1.2">
        <h3>近 14 天每日新增邀请</h3>
        <div class="trend" id="bd-trend"></div>
      </div>
      <div class="block" style="flex:1">
        <h3>邀请人 Top 10</h3>
        <table>
          <thead><tr><th>#</th><th>邀请人</th><th>邀请数</th><th>已首订</th></tr></thead>
          <tbody id="bd-top"></tbody>
        </table>
      </div>
    </div>

    <div class="block">
      <h3>邀请明细 <span style="font-size:12px;color:var(--gray);font-weight:400">（选择用户查看其带来的新用户）</span></h3>
      <div style="display:flex; gap:12px; align-items:center; margin-bottom:14px">
        <select id="bd-user" onchange="loadInviteDetails()" style="width:300px"></select>
        <span style="font-size:12px;color:var(--gray)" id="bd-user-count"></span>
      </div>
      <table>
        <thead><tr><th>被邀请人</th><th>状态</th><th>绑定时间</th><th>已发奖励</th></tr></thead>
        <tbody id="bd-details"></tbody>
      </table>
      <div class="empty-tip" id="bd-details-empty" style="display:none">该用户暂无邀请记录</div>
    </div>
  </main>
</section>

<script>
var meta = { coaches: [], venues: [], categories: [], images: [], timeSlots: [], weekdays: [], capacities: [], statusLabels: {}, levels: [], durations: [], prices: [] };
var courses = [];
var editingId = 0;

function $(id) { return document.getElementById(id); }
function toast(el, text, isErr) { el.textContent = text; el.className = 'msg' + (isErr ? ' err' : ''); if (text) setTimeout(function () { el.textContent = ''; }, 4000); }
function api(path, method, body) {
  var opt = { method: method || 'GET', headers: { 'Content-Type': 'application/json' } };
  if (body !== undefined) opt.body = JSON.stringify(body);
  return fetch('/api' + path, opt).then(function (r) { return r.json().catch(function () { return {}; }); }).then(function (j) { if (j.code && j.code !== 200) throw new Error(j.message || '请求失败'); return j; });
}

// ===== 工具 =====
function fillSel(id, items, val, txt, empty) {
  var s = $(id), html = '';
  if (empty) html += '<option value="">' + empty + '</option>';
  (items || []).forEach(function (it) { html += '<option value="' + it[val] + '">' + it[txt] + '</option>'; });
  s.innerHTML = html;
}
function daysOptions(from, to, selected) {
  var html = '', d = new Date(from), end = new Date(to);
  while (d <= end) {
    var iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    html += '<option value="' + iso + '"' + (iso === selected ? ' selected' : '') + '>' + iso + '</option>';
    d.setDate(d.getDate() + 1);
  }
  return html;
}

// ===== Tab =====
function switchTab(name) {
  $('panel-set').classList.toggle('hidden', name !== 'set');
  $('panel-sch').classList.toggle('hidden', name !== 'sch');
  $('panel-board').classList.toggle('hidden', name !== 'board');
  $('tab-set').classList.toggle('active', name === 'set');
  $('tab-sch').classList.toggle('active', name === 'sch');
  $('tab-board').classList.toggle('active', name === 'board');
  if (name === 'sch') loadSchedule();
  if (name === 'board') loadInviteBoard();
}

// ===== 加载元数据 & 课程 =====
function init() {
  return Promise.all([api('/meta'), api('/courses')]).then(function (res) {
    meta = res[0]; courses = res[1].courses || [];
    fillSel('f-category', meta.categories.map(function (c) { return { v: c, t: c }; }), 'v', 't', '请选择分类');
    fillSel('f-level', meta.levels.map(function (v) { return { v: v, t: v + ' 级' }; }), 'v', 't');
    fillSel('f-duration', meta.durations.map(function (v) { return { v: v, t: v + ' 分钟' }; }), 'v', 't');
    fillSel('f-price', meta.prices.map(function (v) { return { v: v, t: '¥' + v }; }), 'v', 't');
    fillSel('f-status', Object.keys(meta.statusLabels).map(function (k) { return { v: k, t: meta.statusLabels[k] }; }), 'v', 't');
    fillSel('f-cover', meta.images.map(function (p) { return { v: p, t: p.split('/').pop() }; }), 'v', 't', '无封面');
    renderCourseList();
    fillScheduleCourse();
    $('f-date-from').innerHTML = daysOptions(new Date(), new Date(new Date().getTime() + 60 * 864e5), today());
    $('f-date-to').innerHTML = daysOptions(new Date(), new Date(new Date().getTime() + 60 * 864e5), todayPlus(20));
  });
}
function today() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function todayPlus(n) { var d = new Date(Date.now() + n * 864e5); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

// ===== 课程设定 =====
function renderCourseList() {
  $('courseList').innerHTML = courses.map(function (c) {
    return '<div class="list-item' + (c.id === editingId ? ' active' : '') + '" onclick="selectCourse(' + c.id + ')">' +
      '<div class="li-name">' + esc(c.name) + '<span class="badge ' + (c.status === 'published' ? 'badge-pub' : 'badge-draft') + '">' + (meta.statusLabels[c.status] || c.status) + '</span></div>' +
      '<div class="li-meta">' + esc(c.category) + ' · 难度' + c.level + ' · ¥' + (c.price_fen / 100) + ' · ' + (c.rules ? c.rules.length : 0) + ' 条规则</div>' +
      '</div>';
  }).join('');
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; }); }
function newCourse() {
  editingId = 0;
  ['f-name'].forEach(function (id) { $(id).value = ''; });
  ['f-category', 'f-level', 'f-duration', 'f-price', 'f-status', 'f-cover'].forEach(function (id) { $(id).value = ''; });
  $('f-description').value = ''; $('f-tags').value = '';
  $('f-summary').value = ''; $('f-address').value = '成都市成华区好事健身馆';
  $('f-lat').value = 30.6636; $('f-lng').value = 104.1049; $('f-coachbio').value = '';
  galleryImages = [];
  renderGallery();
  $('coverImg').style.display = 'none'; $('coverImg').removeAttribute('src');
  updateMemberHint(); renderCourseList();
}
function selectCourse(id) {
  var c = courses.find(function (x) { return x.id === id; });
  if (!c) return;
  editingId = id;
  $('f-name').value = c.name;
  $('f-category').value = c.category; $('f-level').value = c.level; $('f-duration').value = c.duration_min;
  $('f-price').value = c.price_fen / 100; $('f-status').value = c.status;
  $('f-description').value = c.description || ''; $('f-tags').value = c.tags || '';
  $('f-cover').value = c.cover || '';
  $('f-summary').value = c.summary || '';
  $('f-address').value = c.address || '成都市成华区好事健身馆';
  $('f-lat').value = c.lat || 30.6636; $('f-lng').value = c.lng || 104.1049;
  $('f-coachbio').value = c.coach_bio || '';
  try { galleryImages = JSON.parse(c.images || '[]').filter(Boolean).slice(0, 5); } catch (e) { galleryImages = []; }
  renderGallery();
  updateMemberHint(); previewCover(); renderCourseList();
}
function updateMemberHint() {
  var p = Number($('f-price').value);
  $('memberHint').textContent = p ? '会员价 = ¥' + Math.floor(p * 0.9) + '（正价 9 折向下取整，自动计算）' : '';
}
function previewCover() {
  var v = $('f-cover').value;
  if (v) { $('coverImg').src = v; $('coverImg').style.display = 'block'; }
  else { $('coverImg').style.display = 'none'; $('coverImg').removeAttribute('src'); }
}
var galleryImages = [];
function renderGallery() {
  var html = '';
  for (var i = 0; i < 5; i++) {
    var img = galleryImages[i];
    html += '<div class="gal-item' + (img ? '' : ' gal-empty') + '">' +
      (img ? '<img src="' + img + '" alt="图' + (i + 1) + '">' : '<div class="gal-ph">' + (i + 1) + '</div>') +
      '<div class="gal-foot"><span>图' + (i + 1) + '</span>' +
      (img ? '<span class="gal-x" onclick="removeGalleryImg(' + i + ')">✕</span>' : '') +
      (img && i > 0 ? '<span class="gal-mv" onclick="moveGalleryImg(' + i + ',-1)">◀</span>' : '') +
      (img && i < 4 ? '<span class="gal-mv" onclick="moveGalleryImg(' + i + ',1)">▶</span>' : '') +
      '</div></div>';
  }
  $('galleryBox').innerHTML = html;
}
function uploadGallery(input) {
  var file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  if (file.size > 512 * 1024) { alert('图片超过 512KB 限制，请压缩后上传'); return; }
  if (galleryImages.length >= 5) { alert('最多 5 张轮播图'); return; }
  var reader = new FileReader();
  reader.onload = function () {
    api('/upload', 'POST', { name: file.name, data: reader.result, dir: 'uploads' }).then(function (j) {
      galleryImages.push(j.path);
      renderGallery();
      toast($('saveMsg'), '已上传：' + j.path);
    }).catch(function (e) { toast($('saveMsg'), e.message, true); });
  };
  reader.readAsDataURL(file);
}
function removeGalleryImg(i) { galleryImages.splice(i, 1); renderGallery(); }
function moveGalleryImg(i, dir) {
  var j = i + dir;
  if (j < 0 || j >= galleryImages.length) return;
  var t = galleryImages[i]; galleryImages[i] = galleryImages[j]; galleryImages[j] = t;
  renderGallery();
}
function uploadImage(input) {
  var file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  if (file.size > 512 * 1024) { alert('图片超过 512KB 限制，请压缩后上传'); return; }
  var reader = new FileReader();
  reader.onload = function () {
    api('/upload', 'POST', { name: file.name, data: reader.result }).then(function (j) {
      meta.images.push(j.path);
      fillSel('f-cover', meta.images.map(function (p) { return { v: p, t: p.split('/').pop() }; }), 'v', 't', '无封面');
      $('f-cover').value = j.path;
      previewCover();
      toast($('saveMsg'), '图片已上传：' + j.path);
    }).catch(function (e) { toast($('saveMsg'), e.message, true); });
  };
  reader.readAsDataURL(file);
}
function saveCourse() {
  var name = $('f-name').value.trim();
  if (!name) return toast($('saveMsg'), '请填写课程名称', true);
  var data = {
    name: name, category: $('f-category').value, level: Number($('f-level').value),
    duration_min: Number($('f-duration').value), price_fen: Math.round(Number($('f-price').value) * 100),
    cover: $('f-cover').value || '', description: $('f-description').value.trim(),
    tags: $('f-tags').value.trim(), status: $('f-status').value, rules: [],
    images: galleryImages.slice(0, 5), summary: $('f-summary').value.trim(),
    address: $('f-address').value.trim() || '成都市成华区好事健身馆',
    lat: Number($('f-lat').value) || 30.6636, lng: Number($('f-lng').value) || 104.1049,
    coach_bio: $('f-coachbio').value.trim()
  };
  var req = editingId ? api('/courses/' + editingId, 'PUT', data).then(function () { return editingId; }) : api('/courses', 'POST', data).then(function (j) { return j.id; });
  req.then(function (id) {
    toast($('saveMsg'), '保存成功');
    return api('/courses').then(function (res) { courses = res.courses; editingId = id; renderCourseList(); fillScheduleCourse(); });
  }).catch(function (e) { toast($('saveMsg'), e.message, true); });
}
function deleteCourse() {
  if (!editingId) return toast($('saveMsg'), '请先选择课程', true);
  if (!confirm('确定删除该课程？其排课规则与未预约场次将一并删除。')) return;
  api('/courses/' + editingId, 'DELETE').then(function () {
    toast($('saveMsg'), '已删除'); editingId = 0; newCourse();
    return api('/courses').then(function (res) { courses = res.courses; renderCourseList(); fillScheduleCourse(); });
  }).catch(function (e) { toast($('saveMsg'), e.message, true); });
}

// ===== 排表管理 =====
function fillScheduleCourse() {
  fillSel('s-course', courses.map(function (c) { return { v: c.id, t: c.name + (c.status === 'draft' ? '（草稿）' : '') }; }), 'v', 't', '');
}
function currentScheduleCourse() { return Number($('s-course').value) || 0; }
function loadSchedule() {
  var cid = currentScheduleCourse();
  renderRules(cid);
  loadSessions();
}
function renderRules(cid) {
  var c = courses.find(function (x) { return x.id === cid; });
  $('rulesBox').innerHTML = '';
  if (!c) { $('rulesBox').innerHTML = '<div class="empty-tip">请先选择课程（或到「课程设定」新增）</div>'; return; }
  var rules = c.rules || [];
  if (rules.length === 0) { addRule(); return; }
  rules.forEach(function (r) { addRule(r); });
}
function addRule(r) {
  r = r || {};
  var row = document.createElement('div');
  row.className = 'rules-row';
  row.innerHTML =
    '<select class="r-weekday">' + meta.weekdays.map(function (w) { return '<option value="' + w.v + '"' + (w.v === r.weekday ? ' selected' : '') + '>' + w.label + '</option>'; }).join('') + '</select>' +
    '<select class="r-start">' + meta.timeSlots.map(function (t) { return '<option' + (t === r.start_time ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select>' +
    '<select class="r-end">' + meta.timeSlots.map(function (t) { return '<option' + (t === r.end_time ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select>' +
    '<select class="r-coach">' + meta.coaches.map(function (c) { return '<option value="' + c.id + '"' + (c.id === r.coach_id ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') + '</select>' +
    '<select class="r-venue">' + meta.venues.map(function (v) { return '<option value="' + v.id + '"' + (v.id === r.venue_id ? ' selected' : '') + '>' + esc(v.name) + '</option>'; }).join('') + '</select>' +
    '<select class="r-cap">' + meta.capacities.map(function (cp) { return '<option value="' + cp + '"' + (cp === r.capacity ? ' selected' : '') + '>' + cp + '人</option>'; }).join('') + '</select>' +
    '<button class="row-del" onclick="this.parentNode.remove()">✕</button>';
  $('rulesBox').appendChild(row);
}
function collectRules() {
  var list = [];
  document.querySelectorAll('#rulesBox .rules-row').forEach(function (row) {
    list.push({
      weekday: Number(row.querySelector('.r-weekday').value),
      start_time: row.querySelector('.r-start').value,
      end_time: row.querySelector('.r-end').value,
      coach_id: Number(row.querySelector('.r-coach').value),
      venue_id: Number(row.querySelector('.r-venue').value),
      capacity: Number(row.querySelector('.r-cap').value)
    });
  });
  return list;
}
function saveRules() {
  var cid = currentScheduleCourse();
  if (!cid) return toast($('rulesMsg'), '请先选择课程', true);
  var rules = collectRules();
  if (rules.length === 0) return toast($('rulesMsg'), '请至少保留一条规则', true);
  api('/courses/' + cid + '/rules', 'PUT', { rules: rules }).then(function () {
    toast($('rulesMsg'), '规则已保存');
    return api('/courses').then(function (res) { courses = res.courses; fillScheduleCourse(); $('s-course').value = cid; });
  }).catch(function (e) { toast($('rulesMsg'), e.message, true); });
}
function publishCourse() {
  var cid = currentScheduleCourse();
  if (!cid) return toast($('pubMsg'), '请先选择课程', true);
  var from = $('f-date-from').value, to = $('f-date-to').value;
  if (from > to) return toast($('pubMsg'), '起始日期不能晚于结束日期', true);
  if (!confirm('发布「' + (courses.find(function (c) { return c.id === cid; }) || {}).name + '」\n' + from + ' ~ ' + to + '\n按排课规则生成场次（已存在的自动跳过）。确定？')) return;
  api('/courses/' + cid + '/publish', 'POST', { start_date: from, end_date: to }).then(function (j) {
    toast($('pubMsg'), j.message); loadSessions();
  }).catch(function (e) { toast($('pubMsg'), e.message, true); });
}
function loadSessions() {
  var cid = currentScheduleCourse();
  var from = $('f-date-from').value, to = $('f-date-to').value;
  var qs = '?from=' + from + '&to=' + to + (cid ? '&course_id=' + cid : '');
  api('/admin/sessions' + qs).then(function (j) {
    var list = j.sessions || [];
    $('sessionCount').textContent = '共 ' + list.length + ' 场';
    $('sessionEmpty').style.display = list.length ? 'none' : 'block';
    $('sessionBody').innerHTML = list.map(function (s) {
      var st = sessionStatus(s);
      return '<tr>' +
        '<td>' + s.date + '</td>' +
        '<td>' + s.start_time + '-' + s.end_time + '</td>' +
        '<td>' + esc(s.course_name) + '</td>' +
        '<td>' + esc(s.coach_name) + '</td>' +
        '<td>' + esc(s.venue_name) + '</td>' +
        '<td>' + s.booked_count + '/' + s.capacity + ' <input class="cap-input" id="cap-' + s.id + '" type="number" min="' + s.booked_count + '" value="' + s.capacity + '"> <button class="cap-save" onclick="saveCap(' + s.id + ')">改</button></td>' +
        '<td class="' + st.cls + '">' + st.text + '</td>' +
        '<td><button class="op-cancel" ' + (s.booked_count > 0 ? 'disabled title="已有学员预约，无法取消"' : '') + ' onclick="cancelSession(' + s.id + ')">取消场次</button></td>' +
        '</tr>';
    }).join('');
  }).catch(function () { $('sessionEmpty').style.display = 'block'; $('sessionEmpty').textContent = '加载失败，请确认后端已启动'; });
}
function sessionStatus(s) {
  if (s.status === 'cancelled') return { text: '已取消', cls: 'st-cancel' };
  var now = new Date();
  var today = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
  if (s.date > today) return { text: '未开始', cls: 'st-pub' };
  if (s.date < today) return { text: '已结束', cls: 'st-end' };
  var h = now.getHours(), m = now.getMinutes(), cur = h * 60 + m;
  var sh = Number(s.start_time.split(':')[0]) * 60 + Number(s.start_time.split(':')[1]);
  var eh = Number(s.end_time.split(':')[0]) * 60 + Number(s.end_time.split(':')[1]);
  if (cur < sh) return { text: '未开始', cls: 'st-pub' };
  if (cur >= eh) return { text: '已结束', cls: 'st-end' };
  return { text: '进行中', cls: 'st-ongoing' };
}
function saveCap(id) {
  var v = $('cap-' + id).value;
  api('/sessions/' + id, 'PUT', { capacity: Number(v) }).then(function () {
    toast($('pubMsg'), '容量已更新'); loadSessions();
  }).catch(function (e) { toast($('pubMsg'), e.message, true); });
}
function cancelSession(id) {
  if (!confirm('确定取消该场次？')) return;
  api('/sessions/' + id, 'DELETE').then(function () {
    toast($('pubMsg'), '场次已取消'); loadSessions();
  }).catch(function (e) { toast($('pubMsg'), e.message, true); });
}

// ===== 邀请看板 =====
var boardUsers = [];
function loadInviteBoard() {
  api('/admin/invite-board').then(function (j) {
    var b = j.board || {};
    $('bd-total').textContent = b.total || 0;
    $('bd-ordered').textContent = b.ordered || 0;
    $('bd-rate').textContent = (b.conversion || '0') + '%';
    $('bd-inviters').textContent = b.inviters || 0;
    $('bd-reward').textContent = '¥' + ((b.rewardFen || 0) / 100).toLocaleString();
    // 趋势条
    var max = Math.max.apply(null, (b.daily || []).map(function (d) { return d.c; }).concat([1]));
    $('bd-trend').innerHTML = (b.daily || []).map(function (d) {
      var h = Math.max(4, Math.round(d.c / max * 90));
      return '<div class="tr-col"><div class="tr-bar" style="height:' + h + 'px"></div><div class="tr-day">' + d.d.slice(5) + '</div><div class="tr-num">' + d.c + '</div></div>';
    }).join('') || '<span style="color:var(--gray);font-size:13px">暂无邀请数据</span>';
    // Top 邀请人
    $('bd-top').innerHTML = (b.top || []).map(function (t, i) {
      return '<tr><td>' + (i + 1) + '</td><td>' + esc(t.inviter_name || t.inviter) + '</td><td>' + t.invited + '</td><td>' + t.ordered_cnt + '</td></tr>';
    }).join('') || '<tr><td colspan="4" class="empty-tip">暂无数据</td></tr>';
  }).catch(function (e) { alert('看板加载失败：' + e.message); });
  // 用户下拉
  api('/users').then(function (j) {
    boardUsers = (j.users || []).filter(function (u) { return u.role !== 'admin'; });
    var html = boardUsers.map(function (u) {
      return '<option value="' + u.openid + '">' + esc(u.nickname || u.openid) + '（' + (u.openid || '').slice(0, 10) + '）</option>';
    }).join('');
    $('bd-user').innerHTML = html || '<option value="">暂无用户</option>';
    $('bd-user-count').textContent = '共 ' + boardUsers.length + ' 位用户';
    loadInviteDetails();
  }).catch(function () {});
}
function loadInviteDetails() {
  var openid = $('bd-user').value;
  if (!openid) return;
  api('/invite/details?openid=' + openid).then(function (j) {
    var list = j.details || [];
    $('bd-details').innerHTML = list.map(function (d) {
      var st = d.status === 'ordered' ? '<span style="color:#3D9970">已首订</span>' : '<span style="color:var(--gray)">已注册</span>';
      return '<tr><td>' + esc(d.invitee_name || d.invitee) + '</td><td>' + st + '</td><td>' + d.created_at + '</td><td>' + (d.reward_fen ? '¥' + (d.reward_fen / 100) : '-') + '</td></tr>';
    }).join('');
    $('bd-details-empty').style.display = list.length ? 'none' : 'block';
  }).catch(function () {});
}

init().catch(function (e) { alert('加载失败：' + e.message); });
</script>
